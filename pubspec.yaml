name: dart_reverb_channels
description: >-
  A Pusher-protocol channels client for Laravel Reverb: shared,
  reference-counted subscriptions, bounded retries, automatic reconnect and
  resubscribe, and pluggable transport, authorization, decryption and logging.
version: 1.2.1
homepage: https://github.com/mahmourad98/dart_reverb_channels
repository: https://github.com/mahmourad98/dart_reverb_channels
issue_tracker: https://github.com/mahmourad98/dart_reverb_channels/issues
topics:
  - laravel
  - reverb
  - pusher
  - websocket
  - realtime

environment:
  sdk: ^3.8.0
  flutter: ^3.32.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0

